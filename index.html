<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具資源庫</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 6px 18px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .card-icon {
      font-size: 2.2rem;
      line-height: 1;
      padding: 8px;
      background-color: #eff6ff;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .card-info h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .card-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      flex-grow: 1;
      margin-bottom: 20px;
    }

    .card-action {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
    }

    .card:hover .card-action {
      color: var(--accent-hover);
    }

    .card-action span {
      transition: transform 0.2s ease;
      margin-left: 4px;
    }

    .card:hover .card-action span {
      transform: translateX(4px);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>實用小工具庫</h1>
      <p>即點即用，支援平板、白板與各類瀏覽器操作</p>
    </header>

    <main class="grid">
      <!-- 工具卡片 1 -->
      <a href="四位數加減.html" class="card" target="_blank">
        <div>
          <div class="card-top">
            <div class="card-icon">4️⃣</div>
            <div class="card-info">
              <h2>四位數加減</h2>
              <span class="badge">三年級數學</span>
            </div>
          </div>
          <p class="card-desc">包含進退位及錢幣換算等功能。。</p>
        </div>
        <div class="card-action">開啟工具 <span>&rarr;</span></div>
      </a>

      <!-- 工具卡片 2 -->
      <a href="二位小數積木工具.html" class="card" target="_blank">
        <div>
          <div class="card-top">
            <div class="card-icon">🎡</div>
            <div class="card-info">
              <h2>二位小數積木工具</h2>
              <span class="badge">四年級數學</span>
            </div>
          </div>
          <p class="card-desc">包含積木換算和練習題等功能</p>
        </div>
        <div class="card-action">開啟工具 <span>&rarr;</span></div>
      </a>

      <!-- 工具卡片 3 -->
      <a href="認識分數.html" class="card" target="_blank">
        <div>
          <div class="card-top">
            <div class="card-icon">⭐</div>
            <div class="card-info">
              <h2>認識分數</h2>
              <span class="badge">四年級數學</span>
            </div>
          </div>
          <p class="card-desc">包含認識真假帶分數和比大小等功能</p>
        </div>
        <div class="card-action">開啟工具 <span>&rarr;</span></div>
      </a>

            <!-- 工具卡片 4 -->
      <a href="分數練習.html" class="card" target="_blank">
        <div>
          <div class="card-top">
            <div class="card-icon"🍿</div>
            <div class="card-info">
              <h2>分數練習</h2>
              <span class="badge">四年級數學</span>
            </div>
          </div>
          <p class="card-desc">包含分數加減乘法等練習題</p>
        </div>
        <div class="card-action">開啟工具 <span>&rarr;</span></div>
      </a>
    </main>
  </div>

</body>
</html>
