<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>披薩烘焙坊</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=cwTeXYen&amp;family=Noto+Sans+TC:wght@400;700&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FFF7ED; /* Orange-50 */
            user-select: none;
            padding-bottom: 80px; /* Space for bottom bar */
        }
        .font-cute {
            font-family: 'cwTeXYen', sans-serif;
        }
        
        /* Fraction Styling */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 0.2rem;
            font-size: 2.5rem;
            font-weight: 800;
            color: #4B5563;
        }
        .fraction-top {
            border-bottom: 4px solid currentColor;
            padding: 1px 6px;
            line-height: 1.1;
            min-width: 1.2em;
            text-align: center;
        }
        .fraction-bottom {
            padding: 4px 6px 0;
            line-height: 1.1;
            min-width: 1.2em;
            text-align: center;
        }
        .whole-number {
            display: inline-block;
            font-size: 3.5rem;
            font-weight: 900;
            vertical-align: middle;
            margin-right: 0.4rem;
            color: #d97706; /* Amber-600 */
        }
        
        /* Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Card Interactions */
        .answer-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .answer-card:active:not([disabled]) {
            transform: scale(0.98);
        }
        
        /* Result States */
        .card-correct {
            background-color: #DCFCE7 !important; /* Green-100 */
            border-color: #22C55E !important;
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        .card-wrong {
            background-color: #FEE2E2 !important; /* Red-100 */
            border-color: #EF4444 !important;
            opacity: 0.7;
        }
        .card-dimmed {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(100%);
        }

        /* Bottom Feedback Bar */
        #feedbackBar {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(110%);
        }
        #feedbackBar.show {
            transform: translateY(0);
        }

        /* Start Screen Styling */
        #startScreen {
            transition: opacity 0.5s ease-out;
        }
        .mode-btn {
            transition: all 0.3s;
        }
        .mode-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
        }

        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #f97316;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #f97316;

<script>
    // --- Audio Setup ---
    let synth;
    let isMuted = true;

    async function initAudio() {
        if (!synth) {
            await Tone.start();
            synth = new Tone.PolySynth(Tone.Synth).toDestination();
            isMuted = false;
            updateMusicIcon();
        }
    }

    function toggleMusic() {
        if (!synth) initAudio();
        else {
            isMuted = !isMuted;
            updateMusicIcon();
        }
    }

    function updateMusicIcon() {
        const icon = document.getElementById('musicIcon');
        icon.innerText = isMuted ? 'music_off' : 'music_note';
        icon.className = isMuted ? 'material-symbols-outlined text-gray-400' : 'material-symbols-outlined text-orange-500';
    }

    function playSound(type) {
        if (isMuted || !synth) return;
        const now = Tone.now();
        if (type === 'correct') synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "16n", now);
        else if (type === 'wrong') synth.triggerAttackRelease(["G3", "Eb3"], "8n", now);
        else if (type === 'click') synth.triggerAttackRelease("C6", "32n", now);
    }

    // --- HTML Export ---
    function exportHTML() {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pizza_bakery_game.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // --- Math Logic ---
    class Fraction {
        constructor(whole, num, den) {
            this.whole = whole; 
            this.num = num;     
            this.den = den;     
        }

        equals(other) {
            return this.whole === other.whole && this.num === other.num && this.den === other.den;
        }

        getImproperNumerator() {
            return this.whole * this.den + this.num;
        }

        toStringHTML() {
            if (this.whole === 0 && this.num === 0) return `<span class="text-4xl font-bold text-gray-400">0</span>`;
            
            let html = '';
            if (this.whole > 0) {
                html += `<span class="whole-number">${this.whole}</span>`;
            }
            if (this.num > 0) {
                 html += `
                <div class="fraction">
                    <span class="fraction-top">${this.num}</span>
                    <span class="fraction-bottom">${this.den}</span>
                </div>`;
            }
            return html;
        }
    }

    // --- Game Settings ---
    const gameSettings = {
        allowCarry: true,
        allowBorrow: true,
        allowInteger: false
    };

    function toggleSettings() {
        const modal = document.getElementById('settingsModal');
        modal.classList.toggle('hidden');
        modal.classList.toggle('flex');
        
        if (modal.classList.contains('hidden')) {
            updateSettingsFromUI();
        }
    }

    function updateSettingsFromUI() {
        gameSettings.allowCarry = document.getElementById('toggleCarry').checked;
        gameSettings.allowBorrow = document.getElementById('toggleBorrow').checked;
        gameSettings.allowInteger = document.getElementById('toggleInteger').checked;
    }

    // --- Game State & Logic ---
    let currentFractionType = 'true_fraction'; 
    let currentOperation = 'add'; 
    let currentProblem = null;
    let score = 0;
    let streak = 0;
    let mulStreak = 0; 

    function selectType(type) {
        currentFractionType = type;
        document.getElementById('step1').classList.add('hidden');
        const step2 = document.getElementById('step2');
        step2.classList.remove('hidden');
        void step2.offsetWidth; 
        step2.classList.remove('translate-x-full');
    }

    function resetStartScreen() {
        const step2 = document.getElementById('step2');
        step2.classList.add('translate-x-full');
        setTimeout(() => {
            step2.classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }, 300);
    }

    function startGame(operation) {
        updateSettingsFromUI(); 
        currentOperation = operation;
        score = 0;
        streak = 0;
        mulStreak = 0; 
        document.getElementById('scoreDisplay').innerText = score;
        document.getElementById('streakDisplay').innerText = streak;
        
        const startScreen = document.getElementById('startScreen');
        const gameUI = document.getElementById('gameUI');
        
        startScreen.style.opacity = '0';
        setTimeout(() => {
            startScreen.classList.add('hidden');
            gameUI.classList.remove('hidden');
            requestAnimationFrame(() => {
                gameUI.classList.remove('opacity-0', 'pointer-events-none');
                gameUI.classList.add('opacity-100');
            });
        }, 500);

        generateQuestion();
    }

    function returnToStart() {
        const startScreen = document.getElementById('startScreen');
        const gameUI = document.getElementById('gameUI');
        
        gameUI.classList.remove('opacity-100');
        gameUI.classList.add('opacity-0', 'pointer-events-none');
        
        setTimeout(() => {
            gameUI.classList.add('hidden');
            startScreen.classList.remove('hidden');
            startScreen.style.opacity = '1';
            resetStartScreen();
        }, 500);
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestion() {
        const feedbackBar = document.getElementById('feedbackBar');
        feedbackBar.classList.remove('show');
        
        let attempts = 0;
        while(attempts < 100) {
            attempts++;
            const den = getRandomInt(3, 9);
            let f1, f2, opSymbol, ans;
            let multiplier = 1;
            let valid = true;

            if (currentOperation === 'mul') {
                opSymbol = '×';
                multiplier = getRandomInt(2, 4);
                
                let n1, w1 = 0;
                if (currentFractionType === 'true_fraction') {
                    n1 = getRandomInt(1, den-1);
                    f1 = new Fraction(0, n1, den);
                } else if (currentFractionType === 'improper_fraction') {
                    if (mulStreak < 5) {
                        if (den + 1 <= 10) n1 = getRandomInt(den + 1, 10);
                        else n1 = 10; 
                    } else {
                        n1 = getRandomInt(11, den * 3);
                    }
                    f1 = new Fraction(0, n1, den);
                } else { 
                    w1 = 1; 
                    if (mulStreak < 5) {
                         let maxN = Math.min(den - 1, 10 - den);
                         if (maxN >= 1) n1 = getRandomInt(1, maxN);
                         else n1 = 1;
                    } else {
                        n1 = getRandomInt(1, den - 1);
                        w1 = getRandomInt(1, 2);
                    }
                    f1 = new Fraction(w1, n1, den);
                }
                
                let totalNum = f1.getImproperNumerator() * multiplier;
                ans = new Fraction(0, totalNum, den);
                currentProblem = { f1, f2: null, multiplier, op: opSymbol, ans, den, type: 'mul' };

            } else {
                opSymbol = currentOperation === 'add' ? '+' : '−';
                
                if (currentFractionType === 'true_fraction') {
                    let n1 = getRandomInt(1, den-1);
                    let n2 = getRandomInt(1, den-1);
                    f1 = new Fraction(0, n1, den);
                    f2 = new Fraction(0, n2, den);
                } else if (currentFractionType === 'improper_fraction') {
                    let minN = Math.ceil(den/2);
                    let maxN = den * 2;
                    let n1 = getRandomInt(minN, maxN);
                    let n2 = getRandomInt(minN, maxN);
                    f1 = new Fraction(0, n1, den);
                    f2 = new Fraction(0, n2, den);
                } else { 
                    let w1 = getRandomInt(1, 2);
                    let n1 = getRandomInt(1, den-1);
                    let w2 = (currentOperation === 'add') ? getRandomInt(1, 2) : 1; 
                    let n2 = getRandomInt(1, den-1);
                    
                    if(w2 === 0) w2 = 1;

                    f1 = new Fraction(w1, n1, den);
                    f2 = new Fraction(w2, n2, den);
                }

                // Logic Checks based on Settings
                if (opSymbol === '+') {
                    // Carry Check
                    if (!gameSettings.allowCarry) {
                        if (f1.num + f2.num >= den) valid = false;
                    }
                    
                    let totalNum = (f1.whole * den + f1.num) + (f2.whole * den + f2.num);
                    ans = new Fraction(0, totalNum, den);
                } else {
                    // Subtraction
                    let val1 = f1.whole * den + f1.num;
                    let val2 = f2.whole * den + f2.num;
                    if (val1 <= val2) {
                        if (currentFractionType === 'true_fraction') {
                            let temp = f1; f1 = f2; f2 = temp;
                            val1 = f2.whole * den + f2.num; val2 = f1.whole * den + f1.num; 
                        } else {
                            valid = false;
                        }
                    }

                    // Borrow Check
                    if (valid && !gameSettings.allowBorrow) {
                        if (f1.num < f2.num) valid = false;
                    }

                    let resNum = val1 - val2;
                    ans = new Fraction(0, resNum, den);
                }
                currentProblem = { f1, f2, multiplier: null, op: opSymbol, ans, den, type: 'standard' };
            }

            // Integer Result Check
            if (valid && !gameSettings.allowInteger) {
                if (ans.num % ans.den === 0) valid = false;
            }

            if (valid) break; 
        }

        generateOptions();
        renderUI();
    }

    function generateOptions() {
        const { ans, den } = currentProblem;
        let options = [ans];
        while (options.length < 3) {
            let fake;
            let offset = (Math.random() > 0.5 ? 1 : -1) * getRandomInt(1, 3);
            let fakeNum = ans.num + offset;
            if (fakeNum <= 0) fakeNum = ans.num + 5;
            if (Math.random() > 0.7) fakeNum = getRandomInt(1, den*3);
            
            fake = new Fraction(0, fakeNum, den);
            
            let isUnique = !options.some(o => o.equals(fake));
            if (isUnique) options.push(fake);
        }
        currentProblem.options = options.sort(() => Math.random() - 0.5);
    }

    function renderUI() {
        const { f1, f2, multiplier, op, den, type } = currentProblem;
        const eqEl = document.getElementById('equationDisplay');
        
        if (type === 'mul') {
            eqEl.innerHTML = `
                <div class="flex items-center justify-center">
                    ${f1.toStringHTML()}
                </div>
                <div class="text-6xl font-black text-gray-400 mx-4">×</div>
                <div class="flex items-center justify-center">
                    <span class="text-6xl font-black text-purple-600">${multiplier}</span>
                </div>
                <div class="text-6xl font-black text-gray-400 mx-4">=</div>
                <div class="w-24 h-28 rounded-2xl border-4 border-dashed border-orange-300 bg-orange-50 flex items-center justify-center text-orange-300 text-4xl font-bold">?</div>
            `;
        } else {
            eqEl.innerHTML = `
                <div class="flex items-center justify-center">
                    ${f1.toStringHTML()}
                </div>
                <div class="text-6xl font-black text-gray-400 mx-4">${op}</div>
                <div class="flex items-center justify-center">
                    ${f2.toStringHTML()}
                </div>
                <div class="text-6xl font-black text-gray-400 mx-4">=</div>
                <div class="w-24 h-28 rounded-2xl border-4 border-dashed border-orange-300 bg-orange-50 flex items-center justify-center text-orange-300 text-4xl font-bold">?</div>
            `;
        }

        const hintMsg = document.getElementById('hintMessage');
        if (currentFractionType === 'mixed_fraction') {
            hintMsg.innerHTML = `
                帶分數計算小秘訣：可以<span class="text-orange-600">先換成假分數</span>再計算。<br/>
                算出的答案是假分數也<span class="text-green-600">不用換回帶分數</span>喔！
            `;
        } else {
            hintMsg.innerHTML = `
                記得喔！分母是「<span class="text-orange-500 text-xl font-black">${den}</span>」不要動，<br/>
                我們只要算上面的分子就好！
            `;
        }

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        currentProblem.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.dataset.idx = index; 
            btn.className = `answer-card group relative bg-white rounded-2xl border-2 border-orange-100 p-6 flex flex-col items-center justify-center gap-6 hover:border-orange-400 hover:shadow-lg w-full min-h-[180px]`;
            btn.onclick = () => checkAnswer(opt, btn);
            
            btn.innerHTML = `
                <div class="flex-1 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                    ${opt.toStringHTML()}
                </div>
            `;
            grid.appendChild(btn);
        });
    }

    function skipQuestion() {
        playSound('click');
        generateQuestion();
    }

    function checkAnswer(selected, btn) {
        const correct = selected.equals(currentProblem.ans);
        const buttons = document.querySelectorAll('#optionsGrid button');
        
        buttons.forEach(b => {
            b.disabled = true;
            b.classList.add('cursor-default');
            b.classList.remove('hover:border-orange-400', 'hover:shadow-lg', 'group');
        });

        const feedbackBar = document.getElementById('feedbackBar');
        const icon = document.getElementById('resultIcon');
        const title = document.getElementById('resultTitle');
        const msg = document.getElementById('resultMessage');
        
        msg.innerText = "";

        if (correct) {
            score += 10;
            streak++;
            if (currentOperation === 'mul') mulStreak++;

            playSound('correct');
            btn.classList.add('card-correct');
            
            icon.className = "w-14 h-14 rounded-full flex items-center justify-center bg-green-100 text-green-600";
            icon.innerHTML = '<span class="material-symbols-outlined text-3xl">check</span>';
            title.innerText = "答對囉！";
            title.className = "text-2xl font-bold text-green-700";
            
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.8 }
            });
        } else {
            streak = 0;
            mulStreak = 0; 
            
            playSound('wrong');
            btn.classList.add('card-wrong');
            
            buttons.forEach(b => {
                const idx = b.dataset.idx;
                if (currentProblem.options[idx].equals(currentProblem.ans)) {
                    b.classList.add('card-correct', 'ring-4', 'ring-green-200');
                } else if (b !== btn) {
                    b.classList.add('card-dimmed');
                }
            });

            icon.className = "w-14 h-14 rounded-full flex items-center justify-center bg-red-100 text-red-600";
            icon.innerHTML = '<span class="material-symbols-outlined text-3xl">close</span>';
            title.innerText = "加油再試一次！";
            title.className = "text-2xl font-bold text-red-700";
        }

        document.getElementById('scoreDisplay').innerText = score;
        document.getElementById('streakDisplay').innerText = streak;
        feedbackBar.classList.add('show');
    }
</script>
